; Printer Center settings (~/.config/printer-center/settings.ini)

[device]
; WSD scan service address of the scanner
address = http://PRINTER_IP:8018/wsd/scan

[client]
; Name shown on the device panel (max 15 characters). Empty = computer name.
name =
; Local port the device sends scan notifications to
port = 53580
; IP the device uses to reach this computer. Empty = detected automatically.
ip =
; Folder scans are saved to. Empty = ~/Scans (~/Taramalar when the language is Turkish)
folder =
desktop_notifications = yes
; Interface language: auto (from the operating system), tr or en
language = auto

; Every [profile:...] section appears as a separate destination on the device panel.
[profile:Color]
; empty name = client name
name =
color = color
resolution = 300
paper = A4
format = pdf

;[profile:Gray]
;name = PCNAME GRAY
;color = gray
;resolution = 200
;paper = A4
;format = pdf
